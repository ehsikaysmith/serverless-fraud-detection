# Serverless Fraud Detection Platform: generated by AWS Architecture Advisor.
# Upload build/<name>-function.zip for each function to CodeBucket first, then deploy this template with CodeBucket set.
AWSTemplateFormatVersion: 2010-09-09
Description: Serverless Fraud Detection Platform - generated by AWS Architecture Advisor
Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket (same region as the stack) holding the Lambda zip files
Resources:
  TransactionsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-transactions-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
  TransactionsApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: TransactionsApi
      StageName: $default
      AutoDeploy: true
  ProcessingQueueDlq:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - ProcessingQueueDlq
            - Arn
        maxReceiveCount: 5
  DeadLetterQueueDlq:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - DeadLetterQueueDlq
            - Arn
        maxReceiveCount: 5
  TransactionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  FlaggedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties: {}
  ProcessingQueueScoringFunctionTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::GetAtt:
          - ProcessingQueue
          - Arn
      FunctionName:
        Ref: ScoringFunction
      BatchSize: 10
  IngestFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: resource-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  Fn::GetAtt:
                    - ProcessingQueue
                    - Arn
  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Validates incoming transaction payload (card, amount, merchant, location, timestamp), assigns a transaction ID, and sends it to the processing queue
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Role:
        Fn::GetAtt:
          - IngestFunctionRole
          - Arn
      Code:
        S3Bucket:
          Ref: CodeBucket
        S3Key: functions/ingest-function.zip
      Environment:
        Variables:
          PROCESSING_QUEUE_QUEUE_URL:
            Ref: ProcessingQueue
  IngestFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${IngestFunction}
      RetentionInDays: 14
  ScoringFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: resource-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - ProcessingQueue
                    - Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  Fn::Sub: ${TransactionsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::GetAtt:
                    - TransactionsBucket
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - Fn::GetAtt:
                      - FlaggedTable
                      - Arn
                  - Fn::Sub: ${FlaggedTable.Arn}/index/*
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  Ref: AlertsTopic
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-explainer-function
  ScoringFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Runs rule-based checks (amount threshold, velocity per card in 1h window, geo-impossible travel) then scores with an Isolation Forest model packaged as a Lambda layer. Writes raw+scored data to S3, flagged transactions to DynamoDB, high-risk alerts to SNS,
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 30
      Role:
        Fn::GetAtt:
          - ScoringFunctionRole
          - Arn
      Code:
        S3Bucket:
          Ref: CodeBucket
        S3Key: functions/scoring-function.zip
      Environment:
        Variables:
          TRANSACTIONS_BUCKET_BUCKET_NAME:
            Ref: TransactionsBucket
          FLAGGED_TABLE_TABLE_NAME:
            Ref: FlaggedTable
          ALERTS_TOPIC_TOPIC_ARN:
            Ref: AlertsTopic
          EXPLAINER_FUNCTION_FUNCTION_NAME:
            Fn::Sub: ${AWS::StackName}-explainer-function
  ScoringFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ScoringFunction}
      RetentionInDays: 14
  ExplainerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: resource-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - Fn::GetAtt:
                      - FlaggedTable
                      - Arn
                  - Fn::Sub: ${FlaggedTable.Arn}/index/*
  ExplainerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-explainer-function
      Description: Invoked asynchronously for flagged transactions. Calls Bedrock Claude 3 Haiku with the transaction context and scoring details to generate a plain-English fraud explanation. Enforces a monthly call cap via a DynamoDB counter. Updates the flagged table with
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Role:
        Fn::GetAtt:
          - ExplainerFunctionRole
          - Arn
      Code:
        S3Bucket:
          Ref: CodeBucket
        S3Key: functions/explainer-function.zip
      Environment:
        Variables:
          FLAGGED_TABLE_TABLE_NAME:
            Ref: FlaggedTable
  ExplainerFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ExplainerFunction}
      RetentionInDays: 14
  QueryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: resource-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - Fn::GetAtt:
                      - FlaggedTable
                      - Arn
                  - Fn::Sub: ${FlaggedTable.Arn}/index/*
  QueryFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Handles GET /flagged endpoint with optional query parameters (minRiskScore, startDate, endDate, merchantId). Returns paginated flagged transactions with their Bedrock explanations from DynamoDB
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Role:
        Fn::GetAtt:
          - QueryFunctionRole
          - Arn
      Code:
        S3Bucket:
          Ref: CodeBucket
        S3Key: functions/query-function.zip
      Environment:
        Variables:
          FLAGGED_TABLE_TABLE_NAME:
            Ref: FlaggedTable
  QueryFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${QueryFunction}
      RetentionInDays: 14
  TransactionsApiIngestFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: TransactionsApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::GetAtt:
          - IngestFunction
          - Arn
      PayloadFormatVersion: "2.0"
  TransactionsApiIngestFunctionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: TransactionsApi
      RouteKey: ANY /ingest-function/{proxy+}
      Target:
        Fn::Sub: integrations/${TransactionsApiIngestFunctionIntegration}
  IngestFunctionTransactionsApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
          - IngestFunction
          - Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TransactionsApi}/*
  TransactionsApiQueryFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: TransactionsApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::GetAtt:
          - QueryFunction
          - Arn
      PayloadFormatVersion: "2.0"
  TransactionsApiQueryFunctionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: TransactionsApi
      RouteKey: ANY /query-function/{proxy+}
      Target:
        Fn::Sub: integrations/${TransactionsApiQueryFunctionIntegration}
  QueryFunctionTransactionsApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
          - QueryFunction
          - Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TransactionsApi}/*
  IngestFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Errors in Transaction Ingest
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: IngestFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ScoringFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Errors in Fraud Scoring Engine
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ScoringFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ExplainerFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Errors in Bedrock Explainer
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ExplainerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  QueryFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Errors in Query Flagged Transactions
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: QueryFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  TransactionsApiUrl:
    Value:
      Fn::GetAtt:
        - TransactionsApi
        - ApiEndpoint
  ProcessingQueueQueueUrl:
    Value:
      Ref: ProcessingQueue
  DeadLetterQueueQueueUrl:
    Value:
      Ref: DeadLetterQueue
  TransactionsBucketBucketName:
    Value:
      Ref: TransactionsBucket
  FlaggedTableTableName:
    Value:
      Ref: FlaggedTable
  AlertsTopicTopicArn:
    Value:
      Ref: AlertsTopic
